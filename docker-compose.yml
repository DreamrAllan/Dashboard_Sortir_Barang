

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sortir-barang-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:80"
    networks:
      - sortir-barang-network
    depends_on:
      - db
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=sortir_barang
      - DB_USERNAME=root
      - DB_PASSWORD=secret

  db:
    image: mysql:8.0
    container_name: sortir-barang-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: sortir_barang
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - sortir-barang-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sortir-barang-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    networks:
      - sortir-barang-network
    depends_on:
      - db

networks:
  sortir-barang-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local