stages:
  - test
  - build
  - deploy

variables:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: sortir_barang_test
  DB_HOST: mysql
  DB_USERNAME: root

cache:
  paths:
    - vendor/

test:
  stage: test
  image: php:8.2-cli
  services:
    - mysql:8.0
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl libzip-dev unzip
    - docker-php-ext-install pdo_mysql zip
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-ansi --no-interaction --no-progress
    - cp .env.example .env
    - php artisan key:generate
    - php artisan config:clear
  script:
    - php artisan migrate --force
    - php artisan test
  only:
    - main
    - dev

build:
  stage: build
  image: php:8.2-cli
  before_script:
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install --no-dev --optimize-autoloader
  script:
    - echo "Build completed successfully"
  artifacts:
    paths:
      - vendor/
    expire_in: 1 hour
  only:
    - main

deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - ssh $SERVER_USER@$SERVER_IP "cd /var/www/sortir-barang && git pull origin main && php artisan migrate --force && php artisan config:cache"
  environment:
    name: production
    url: http://$SERVER_IP
  only:
    - main
  when: manual